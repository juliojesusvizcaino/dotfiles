- name: Setup Nushell
  hosts: localhost
  roles:
    - yethal.nushell
  vars:
    disable_banner: true

- name: Install Kitty Terminal
  hosts: localhost
  tasks:
    - name: Get latest release version
      uri:
        url: https://sw.kovidgoyal.net/kitty/current-version.txt
        return_content: yes
      register: release_version_output
      changed_when: False

    - name: Set release version
      set_fact:
        release_version: "{{ release_version_output.content }}"
        previous_kitty_version: "{{ (lookup('pipe', ansible_env.HOME + '/.local/bin/kitty --version', errors='ignore') or ' never').split(' ')[1] }}"
        previous_kitten_version: "{{ (lookup('pipe', ansible_env.HOME + '/.local/bin/kitten --version', errors='ignore') or ' never').split(' ')[1] }}"

    - name: Create directory for Kitty installer
      file:
        path: "{{ ansible_env.HOME }}/.local/kitty.app/"
        state: directory
      when: "release_version != previous_kitty_version"

    - name: Extract Kitty installer
      unarchive:
        src: "https://github.com/kovidgoyal/kitty/releases/download/v{{ release_version }}/kitty-{{ release_version }}-{{ ansible_architecture }}.txz"
        dest: "{{ ansible_env.HOME }}/.local/kitty.app/"
        remote_src: yes
        extra_opts:
          - "--recursive-unlink"
      when: "release_version != previous_kitty_version"

    - name: Create symlink for kitty binary
      file:
        src: "{{ ansible_env.HOME }}/.local/kitty.app/bin/kitty"
        dest: "{{ ansible_env.HOME }}/.local/bin/kitty"
        state: link
      when: "release_version != previous_kitty_version"

    - name: Create symlink for kitten binary
      file:
        src: "{{ ansible_env.HOME }}/.local/kitty.app/bin/kitten"
        dest: "{{ ansible_env.HOME }}/.local/bin/kitten"
        state: link
      when: "release_version != previous_kitten_version"


- name: Install Rust
  hosts: localhost
  gather_facts: true
  # become: true
  # become_user: "{{ lookup('env', 'USER') }}"

  # pre_tasks:
  #   - name: update repositories
  #     apt: update_cache=yes
  #     become_user: root
  #     changed_when: False
  # vars:
  #   user: "{{ ansible_user_id }}"
  tasks:
  - name: check if cargo is installed
    shell: command -v cargo
    register: cargo_exists
    ignore_errors: yes

  - name: Download Installer
    when: cargo_exists is failed
    get_url:
      url: https://sh.rustup.rs
      dest: /tmp/sh.rustup.rs
      mode: '0755'
      force: 'yes'
    tags:
      - rust

  - name: install rust/cargo
    when: cargo_exists is failed
    shell: /tmp/sh.rustup.rs -y
    tags:
      - rust

- name: Install cargo binstall
  hosts: localhost
  gather_facts: true
  # become: true
  # become_user: "{{ lookup('env', 'USER') }}"

  # pre_tasks:
  #   - name: update repositories
  #     apt: update_cache=yes
  #     become_user: root
  #     changed_when: False
  # vars:
  #   user: "{{ ansible_user_id }}"
  tasks:
  - name: check if cargo binstall is installed
    shell: cargo binstall
    register: binstall_exists
    ignore_errors: yes

  - name: install rust/cargo
    when: binstall_exists is failed
    shell: cargo install cargo-binstall
    tags:
      - rust
